name: Libraries

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build-libraries:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, cpu: x86_64, file: Linux.sh }
          - { name: linux-arm64, os: ubuntu-22.04-arm, cpu: aarch64, file: Linux.sh }

          - { name: win-x64, os: windows-2022, cpu: x64, file: Windows.sh }
          - { name: win-arm64, os: windows-2022, cpu: arm64, file: Windows.sh }

          - { name: osx-arm64, os: macos-15, cpu: arm64, file: Mac.sh }
          - { name: osx-x64, os: macos-15-intel, cpu: x86_64, file: Mac.sh }

          - { name: android-x86, os: ubuntu-22.04, cpu: x86, file: Android.sh }
          - { name: android-x86_64, os: ubuntu-22.04, cpu: x86_64, file: Android.sh }
          - { name: android-arm64-v8a, os: ubuntu-22.04, cpu: arm64-v8a, file: Android.sh }
          - { name: android-armeabi-v7a, os: ubuntu-22.04, cpu: armeabi-v7a, file: Android.sh }

          - { name: ios-arm64, os: macos-15, cpu: arm64, extra: iphoneos, file: IOS.sh }
          - { name: iossimulator-arm64, os: macos-15, cpu: arm64, extra: iphonesimulator, file: IOS.sh }
          - { name: iossimulator-x64, os: macos-15-intel, cpu: x86_64, extra: iphonesimulator, file: IOS.sh }

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Build
        shell: bash
        env:
          EXTRA: ${{ matrix.extra }}
          NAME: ${{ matrix.name }}
          CPU: ${{ matrix.cpu }}
        run: |
          chmod +x .github/scripts/${{ matrix.file }}
          ./.github/scripts/${{ matrix.file }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.name }}
          path: outputs
  
  publish:
    name: Publish
    needs: build-libraries
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
          fetch-depth: 0

      - name: Configure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Branch
        run: |
          git push origin --delete Libraries || true
          git checkout --orphan Libraries
          git rm -rf . || true
          git clean -fdx || true

      - name: Download
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          skip-decompress: true

      - name: Commit
        run: |
          find artifacts -type f -name '*.zip' -print0 |
            while IFS= read -r -d '' zip; do
              name="$(basename "$zip" .zip)"
              mkdir -p "$name"
              unzip -q "$zip" -d "$name"
            done

          git add . ':!artifacts'
          git commit -m "Libraries"
          git push origin Libraries --force

      - name: Reference
        run: |
          SUBMODULE_PATH="Source/Natives/Libraries"
          
          git checkout ${{ github.ref_name }}
          
          git submodule add -f -b Libraries https://github.com/${{ github.repository }} $SUBMODULE_PATH || true
          git submodule set-branch -b Libraries -- "$SUBMODULE_PATH"
          git submodule update --init --force --remote "$SUBMODULE_PATH"
          
          git add .gitmodules "$SUBMODULE_PATH"
          git commit -m "Libraries" || echo "No changes"
          git push origin ${{ github.ref_name }}